spring.application.name=tram-sach
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
spring.profiles.active=${APP_PROFILE:default}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tram_sach}
spring.datasource.username=${DB_USER:tram_sach}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.flyway.url=${DB_DIRECT_URL:${spring.datasource.url}}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=7d
spring.thymeleaf.cache=true
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=64KB
