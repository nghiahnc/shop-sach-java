<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Chi tiết sách')}"></head><body><header th:replace="~{fragments :: header}"></header><main id="main" class="container">
<div class="breadcrumb"><a th:href="@{/}">Trang chủ</a><span>/</span><a th:href="@{/books}">Bộ sưu tập</a><span>/</span><span th:text="${book.categoryName}"></span></div><div class="product-detail"><div class="product-gallery"><img th:src="@{${'/images/book-'+#numbers.formatInteger(book.cover,2)+'.webp'}}" th:alt="${book.title+' — '+book.author}" width="720" height="1080" fetchpriority="high"></div><section class="product-copy"><p class="eyebrow" th:text="${book.categoryName}"></p><h1 th:text="${book.title}"></h1><p class="muted" th:text="${book.author}"></p><div class="price" th:text="${book.price.display()}"></div><p class="availability" th:text="${book.stock>0?'Hiện có '+book.stock+' cuốn':'Tạm hết hàng'}"></p><form class="product-purchase" th:action="@{/cart/add}" method="post"><input type="hidden" name="bookId" th:value="${book.id}"><label class="sr-only" for="quantity">Số lượng</label><input id="quantity" type="number" name="quantity" min="1" max="99" value="1"><button type="submit" th:disabled="${book.stock==0}">Thêm vào giỏ sách</button></form><div class="product-description"><h2>Về cuốn sách</h2><p th:text="${book.description}"></p></div><div class="product-note"><p>Giao hàng 20.000đ · Miễn phí từ 300.000đ sau giảm giá.</p><p>Đây là bản trình diễn. Giá, giao hàng và thanh toán đều dùng cho demo.</p></div></section></div><section class="collection-section"><div class="section-heading"><p class="eyebrow">TIẾP NỐI CẢM HỨNG</p><h2>Cùng một góc kệ.</h2></div><div class="book-grid related-grid"><th:block th:each="book:${related}"><article th:replace="~{fragments :: card(${book})}"></article></th:block></div></section>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
