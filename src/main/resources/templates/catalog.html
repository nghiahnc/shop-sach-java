<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Bộ sưu tập sách')}"></head><body><header th:replace="~{fragments :: header}"></header><main id="main" class="container">
<div class="page-head collection-title"><p class="eyebrow">BỘ SƯU TẬP TRẠM SÁCH</p><h1>Những điều đáng đọc.</h1><p class="muted">Chọn một cuốn sách cho hành trình của riêng bạn.</p></div><div class="category-tabs"><a th:href="@{/books}" th:classappend="${category==null?'active':''}">Tất cả sách</a><a th:each="c:${categories}" th:href="@{/books(category=${c.id})}" th:classappend="${category==c.id?'active':''}" th:text="${c.name}"></a></div><form class="catalog-tools" th:action="@{/books}" method="get"><div class="catalog-search"><label class="sr-only" for="q">Tìm theo tên sách hoặc tác giả</label><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg><input id="q" name="q" th:value="${q}" placeholder="Tên sách hoặc tác giả" maxlength="160"></div><input th:if="${category!=null}" type="hidden" name="category" th:value="${category}"><div class="price-filter"><label class="sr-only" for="min">Giá từ (VND)</label><input id="min" type="number" name="min" th:value="${min}" placeholder="Giá từ" min="0" step="1000"><span>—</span><label class="sr-only" for="max">Giá đến (VND)</label><input id="max" type="number" name="max" th:value="${max}" placeholder="Đến" min="0" step="1000"></div><label class="sr-only" for="sort">Sắp xếp</label><select id="sort" name="sort"><option value="title" th:selected="${sort=='title'}">Tên sách A–Z</option><option value="priceAsc" th:selected="${sort=='priceAsc'}">Giá tăng dần</option><option value="priceDesc" th:selected="${sort=='priceDesc'}">Giá giảm dần</option></select><button class="secondary" type="submit">Tìm sách</button></form><div class="catalog-count"><span th:text="${page.total+' đầu sách'}"></span><a class="underlined" th:href="@{/books}">Xóa bộ lọc</a></div><div th:replace="~{fragments :: flash}"></div><div class="book-grid"><th:block th:each="book:${page.content}"><article th:replace="~{fragments :: card(${book})}"></article></th:block></div><div class="empty" th:if="${page.total==0}"><h2>Chưa tìm thấy cuốn sách phù hợp.</h2><p>Thử một từ khóa hoặc khoảng giá khác.</p><a class="button secondary" th:href="@{/books}">Xem tất cả sách</a></div><nav class="pagination" aria-label="Phân trang" th:if="${page.pages>1}"><a th:each="n:${#numbers.sequence(0,page.pages-1)}" th:href="@{/books(q=${q},category=${category},min=${min},max=${max},sort=${sort},page=${n})}" th:classappend="${n==page.number?'current':''}" th:aria-current="${n==page.number?'page':null}" th:text="${n+1}"></a></nav>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
