<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('Đơn của tôi')}"></head>
  <body>
    <header th:replace="~{fragments :: header}"></header>
    <main id="main" class="container">
      <div class="page-head">
        <div class="eyebrow">NHỮNG CÂU CHUYỆN ĐÃ CHỌN</div>
        <h1>Đơn sách của tôi.</h1>
      </div>
      <div class="empty panel" th:if="${orders.isEmpty()}">
        <h2>Chưa có đơn hàng nào.</h2>
        <p>Cuốn sách đầu tiên vẫn đang chờ bạn trên kệ.</p>
        <a class="button" th:href="@{/books#catalog}">Chọn sách</a>
      </div>
      <div class="panel table-scroll" th:unless="${orders.isEmpty()}">
        <table>
          <thead>
            <tr>
              <th>Mã đơn</th>
              <th>Thời gian</th>
              <th>Trạng thái</th>
              <th>Tổng tiền</th>
              <th>Thanh toán</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="o:${orders}">
              <td>
                <a
                  th:href="@{/account/orders/{id}(id=${o.id()})}"
                  th:text="${o.code()}"
                ></a>
              </td>
              <td th:text="${@ui.time(o.createdAt())}"></td>
              <td>
                <span class="badge" th:text="${o.status().label()}"></span>
              </td>
              <td th:text="${o.total().display()}"></td>
              <td
                th:text="${o.method()+' · '+(o.paid()?'Đã thu':'Chưa thu')}"
              ></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
    <footer th:replace="~{fragments :: footer}"></footer>
  </body>
</html>
